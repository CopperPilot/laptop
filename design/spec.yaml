  reason: Moving from 1S to 2S2P (7.4V nominal, 6.0-8.4V) cuts battery and charger/converter currents in half for the same power (~3.0-4.8A instead of 11-13A), eliminates the dual-AO4407A battery bypass stage (Q_BAT1/Q_BAT2) and the 4 separate cell connectors/fuses/ballast resistors, allows direct 20V USB-C PD charging at 45-65W through BQ25798RQMR with a single autonomous CH224A 20V PD sink (eliminating FUSB302BMPX and the discrete 13V OVP circuit on usb_left), and replaces the 5V boost converter with a high-efficiency 6A synchronous buck converter (TPS56628DDAR) from 2S VSYS (6.0-8.6V).
