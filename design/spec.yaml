requirements:
- id: R1
  text: Thin aluminum laptop matching reference dimensions (297.5 x 206.4 x 12.7 mm)
  how_met: CNC 6061-T6 aluminum top_deck, continuous bottom_shell, and continuous lid_shell totaling 297.5 x 206.4 x 12.7 mm closed
  quantity: 297.5 x 206.4 x 12.7 mm
- id: R2
  text: Raspberry Pi Compute Module 5 brain with real 3D model from rea-hw ref cm5
  how_met: rea_refs:ComputeModule5-CM5 footprint on main carrier PCB with real CM5_module.stl model
  quantity: 1x CM5 module (55.3 x 40.3 x 4.92 mm)
- id: R3
  text: 2 USB-C ports on left edge (front-left 45-65W 20V PD charging + data; rear-left data + 5V out) and 1 headphone jack on right edge
  how_met: 'usb_left daughterboard (single-sided top assembly so bottom_shell is continuous with no through-cutouts) with 2x TYPE-C-31-M-12 (J2 with autonomous CH224A PD 3.0 sink controller U1 strapped for 20V PD negotiation via single-resistor R11=120k 1% C25750 on CFG1 to GND with CFG2/CFG3 open per CH224 Section 5.2.1 [20V @ 2.25-3.25A = 45-65W], C12=1uF+C13=100nF=1.1uF <=4.7uF unswitched cSnkPwr on J2_VBUS, adjacent back-to-back AO4407A P-MOSFET load switch Q1/Q2 C2841482 with continuous F.Cu polygon pour on /PD_SW_MID controlled by U1.10 PG via 2N7002 Q3/Q4 + R13/R14=10k + C17=100nF soft-start + D9=BZT52C12 gate clamp isolating downstream VBUS_PD bulk capacitance C15=10uF+C16=100nF, TPD6S300RUKR 24V CC/SBU OVP & ESD protector U3 with VPWR powered strictly from J2_VBUS via D3 + R12=1k + D8=BZT52C16 16V Zener clamp + U4 XC6216B332MR-G, SMF24A 24V TVS D6/D7, and RP1 USB3-0 D+/D-; J1 with TPS25810RVCR 5V DFP controller U2 [CHG=GND, CHG_HI=GND advertising Default USB 500mA with 1.7A typ internal switch limit coordinated below upstream U_VBUS SY6280AAC R31=3.3k 2.06A limit, R8=100k C25741 EN pull-up, 2x 150uF 10V 55mOhm polymer tantalum C1/C18 T520C157M010ATE055 C600588 + C19=10uF 50V 0805 C440198 + C2=100nF C307331 = 310.1uF nominal / 308.6uF effective >=120uF cSrcPwr at 5V bias, and wide F.Cu/B.Cu copper pours on /+5V_USBC and /J1_VBUS] + TPD6S300RUKR U5 powered from dedicated 3.3V LDO U6 XC6206P332MR-G C5446 on +5V_USBC + SMF6.0A + RP1 USB3-1 D+/D-), bottom-contact 16P 0.5mm FFC J3 (FPC-05F-16PH20 C2856801, Pad 1 at North y=13.75mm, Pad 16 at South y=21.25mm) mating 1-to-1 with main-board top-contact J_USBL (05B20U16P C18164516), and 1.0mm high-current harnesses J4/J5 feeding BQ25798RQMR 5A 2S buck-boost NVDC charger on main board; audio_right daughterboard with PJ-320D 3.5mm CTIA TRRS jack J1, ICS-40720 differential MEMS mic MK1, TLV7041DBVR comparators U1..U3, and TS5A23159DGSR dual SPDT mic mux U4'
  quantity: 2x USB-C left (20V 45-65W PD + 5V DFP), 1x 3.5mm jack right
- id: R4
  text: Bought scissor-switch laptop keyboard module with readable legends and FPC tail, plus large multi-touch trackpad
  how_met: 270x104mm 78-key ANSI scissor keyboard with keyboard_module_legends.stl and 24P FPC to TCA8418RTWR; 120x76mm I2C glass trackpad with 8P FPC
  quantity: 78 keys with legends, 120x76mm trackpad
- id: R5
  text: Re-arrange battery as 2S2P (7.4V nominal, 6.0-8.4V) filling >=70% of base floor around and under trackpad as one bought pack (four identical cells joined by pack maker with one 2S protection board, balance lead, NTC, and one connector)
  how_met: 'Single bought 2S2P Li-Po laptop battery pack (battery_pack, LP4466104-2S2P-9000MAH, 7.4V nominal, 6.0-8.4V, 9,000mAh / 66.6Wh) built from four identical LP4466104 pouch cells (104.0 x 66.0 x 4.4 mm each) contoured around and under trackpad_module (covering >85% of free floor) and joined by the pack maker with an integrated 2S protection/balance board (PCM with mid-point balance lead), 10k NTC thermistor, and one 8-pin JST-PH 2.0mm harness connecting to J_BAT (S8B-PH-SM4-TB(LF)(SN) C265121: pins 1..4 VBAT+ on /VBAT_PACK protected by 5A 1206 fuse F1 JFC1206-1500FS C136351 into /VBAT with R50=100R C25076 Kelvin sense on fused /VBAT, pin 5 TS NTC sense on /CHG_TS protected by D19 TSD05CDYFR C20611048, pins 6..8 GND) on the main board'
