fab:
  profile: jlcpcb
  layers: 4
  thickness_mm: 1.6
  assembly_sides:
  - top
electrical:
  mcu: Raspberry Pi Compute Module 5 (rea_refs:ComputeModule5-CM5)
  power: Front-left USB-C PD 3.0 autonomous sink (CH224A on usb_left, strapped for 20V PD request, 20V @ 2.25-3.25A = 45-65W) -> BQ25798RQMR I2C 5A 1S-4S buck-boost battery charger & NVDC power-path manager (3.6-24V input, charging 2S2P 7.4V nominal [6.0-8.4V] 9,000 mAh / 66.6 Wh Li-Po battery pack at 8.40V via single 8-pin pack connector J_BAT with BATP Kelvin sense and TS 10k NTC sense, regulating NVDC VSYS at 6.0-8.6V) -> TPS56628DDAR 6A synchronous buck converter (4.5-18V input) stepping down 2S VSYS (6.0-8.6V) to +5V (5.06V / 6A continuous) for CM5 +5V inputs, PAM8406DR stereo Class-D speaker amplifier, TLV62569DBVR +3.3V_PER camera/display buck regulator, TPS61165DBVR WLED backlight boost driver, and SY6280AAC / TPS25810RVCR USB-C 5V accessory host power; HT7530S 30V-input 3.0V ultra-low-Iq LDO powers CM5 RTC from always-on 2S VBAT
  blocks:
  - id: cm5_core
    purpose: Raspberry Pi Compute Module 5 (200-pin dual high-density board-to-board footprint rea_refs:Raspberry-Pi-5-Compute-Module), feeding all six +5v_(Input) pins (77,79,81,83,85,87), tying GPIO_VREF (pin 78) to +3.3v_(Output) (pins 84,86), and wiring USB2_P/USB2_N (pins 105/103), USB_OTG_ID (pin 101), PMIC_EN, and nRPIBOOT (pin 93 with top-side SW1 recovery tactile switch) to internal service test pads TP1..TP5 on the top side of the main board (allowing a continuous unperforated bottom_shell)
    key_parts:
    - ComputeModule5-CM5
    - PTS526SM15SMTR2LFS
    reference: https://datasheets.raspberrypi.com/cm5/cm5-datasheet.pdf (Raspberry Pi CM5 Datasheet & CM5IO rev 2 reference)
  - id: power_charger
    purpose: 20V USB-C PD autonomous sink (CH224A on usb_left, 45-65W from 20V / 2.25-3.25A contract) feeding BQ25798RQMR 5A 2S buck-boost NVDC battery charger (3.6-24V input, R_PROG=8.2k for 2S 8.40V @ 750kHz with L1=2.2uH FXL0630-2R2-M, ILIM_HIZ resistor divider setting 3.25A input current limit [65W at 20V], 100R BATP Kelvin sense and 5.23k/30.1k JEITA TS thermistor sense to single 8-pin battery pack header J_BAT S8B-PH-SM4-TB(LF)(SN) protected by 10A fuse F1), TPS56628DDAR 6A synchronous buck converter stepping down 2S VSYS (6.0-8.6V) to +5V (5.06V, R1=124k / R2=22.1k, L2=2.2uH FXL0630-2R2-M), HT7530S 30V-input 3.0V RTC LDO on 2S VBAT, and SY6280AAC high-side switch for USB-C 5V accessory output
    key_parts:
    - CH224A
    - BQ25798RQMR
    - TPS56628DDAR
    - S8B-PH-SM4-TB(LF)(SN)
    - HT7530S
    - SY6280AAC
    reference: https://www.ti.com/lit/ds/symlink/bq25798.pdf (TI BQ25798 1S-4S Buck-Boost Charger & TPS56628 6A Buck Converter standard application circuits)
  - id: display_camera_backlight
    purpose: 22-pin 0.5mm MIPI DSI1 display connector (J_DSI, 4-lane MIPI1_D0..3_P/N + MIPI1_C_P/N + I2C0), TPS61165DBVR constant-current boost LED backlight driver on 2-pin JST-PH (J_BL) dimmed by CM5 GPIO12 PWM, and 22-pin 0.5mm MIPI CSI0 webcam connector (J_CSI, MIPI0_D0..1_P/N + MIPI0_C_P/N + CAM_GPIO0/1 + I2C0) powered by TLV62569DBVR +3.3V_PER buck regulator
    key_parts:
    - FH12-22S-0.5SH(55)
    - TPS61165DBVR
    - TLV62569DBVR
    - S2B-PH-SM4-TB(LF)(SN)
    reference: https://www.ti.com/lit/ds/symlink/tps61165.pdf (TI TPS61165 WLED boost driver reference)
  - id: keyboard_trackpad
    purpose: TCA8418RTWR I2C 8x10 keypad matrix scanner reading all 78 scissor keys via 24-pin 0.5mm FPC connector (J_KB, rows 0..7, cols 0..9, plus power key to CM5 PWR_BUT pin 92) and 8-pin 0.5mm FPC connector (J_TP) carrying I2C1 (GPIO2/GPIO3) + interrupt/reset to capacitive multi-touch trackpad
    key_parts:
    - TCA8418RTWR
    - 05A20L24P
    - FPC-05F-8PH20
    reference: https://www.ti.com/lit/ds/symlink/tca8418.pdf (TI TCA8418 8x10 I2C keypad scan reference)
  - id: audio_subsystem
    purpose: ES8388 low-power I2S stereo codec (connected to CM5 PCM I2S GPIO18..21 and I2C) driving right daughterboard 3.5mm headphone jack (LOUT1/ROUT1 via 8-pin FFC J_AUDR) and PAM8406DR stereo 5W Class-D amplifier (from LOUT2/ROUT2) feeding left and right speaker headers (J_SPKL, J_SPKR), plus differential mic input from ICS-40720 MEMS mic on audio_right
    key_parts:
    - ES8388
    - PAM8406DR
    - S2B-PH-SM4-TB(LF)(SN)
    - FPC-05F-8PH20
    reference: http://www.everest-semi.com/pdf/ES8388%20DS.pdf (Everest ES8388 + Diodes PAM8406 reference)
  - id: usb_left_subboard
    purpose: Left daughterboard (usb_left, single-sided top assembly so bottom_shell is continuous with no through-cutouts) with front-left 45-65W PD charging/data USB-C receptacle (J2, autonomous CH224A 20V PD 3.0 sink controller U1 + TPD6S300RUKR 24V CC/SBU OVP & ESD protector + SMF24A VBUS TVS + RP1 USB3-0-D_P/N) and rear-left accessory USB-C receptacle (J1, TPS25810RVCR 5V DFP controller U2 + TPD6S300RUKR + SMF6.0A + RP1 USB3-1-D_P/N), linked via 16-pin 0.5mm FFC (J3 <-> J_USBL) and high-current wire-to-board headers (J4, J5) to main board
    key_parts:
    - TYPE-C-31-M-12
    - CH224A
    - TPS25810RVCR
    - TPD6S300RUKR
    - 05B20U16P
  - id: audio_right_subboard
    purpose: Right daughterboard (audio_right) with 3.5mm CTIA TRRS headphone/headset jack (J1), ICS-40720 differential analog MEMS microphone (MK1), TLV7041DBVR plug/mic comparators (U1..U3), and TS5A23159DGSR dual SPDT mic mux (U4), linked via 8-pin 0.5mm FFC (J2 <-> J_AUDR) to main board
    key_parts:
    - PJ-320D
    - ICS-40720
    - TLV7041DBVR
    - TS5A23159DGSR
    - FPC-05F-8PH20
  nets_must_connect:
  - - U1.nRPIBOOT
    - SW1.1
  - - U1.USB2_P
    - TP2.1
  - - U1.USB2_N
    - TP3.1
  - - U1.USB3-0-D_P
    - J_USBL.10
  - - U1.USB3-0-D_N
    - J_USBL.11
  - - U1.USB3-1-D_P
    - J_USBL.13
  - - U1.USB3-1-D_N
    - J_USBL.14
  - - U_CHG.SW1
    - L1.1
  - - U_CHG.SW2
    - L1.2
  - - U_BUCK.SW
    - L2.1
  - - U_BL.SW
    - L3.1
  high_speed:
  - name: usb_otg_flash
    board: main
    kind: diff_pairs
    nets:
    - '*USB2_P*'
    - '*USB2_N*'
    tolerance_mm: 1.5
    diff_impedance_ohm: 90.0
    source: 'Raspberry Pi CM5 Datasheet Section 3.3: USB 2.0 90 ohm differential pair'
  - name: usb_host0_port1
    board: main
    kind: diff_pairs
    nets:
    - '*USB3-0-D_P*'
    - '*USB3-0-D_N*'
    tolerance_mm: 1.5
    diff_impedance_ohm: 90.0
    source: 'Raspberry Pi CM5 Datasheet Section 3.4: RP1 USB 2.0 host 90 ohm differential pair'
  - name: usb_host1_port2
    board: main
    kind: diff_pairs
    nets:
    - '*USB3-1-D_P*'
    - '*USB3-1-D_N*'
    tolerance_mm: 1.5
    diff_impedance_ohm: 90.0
    source: 'Raspberry Pi CM5 Datasheet Section 3.4: RP1 USB 2.0 host 90 ohm differential pair'
  - name: mipi_dsi1_display
    board: main
    kind: diff_pairs
    nets:
    - '*MIPI1_C_P*'
    - '*MIPI1_C_N*'
    - '*MIPI1_D0_P*'
    - '*MIPI1_D0_N*'
    - '*MIPI1_D1_P*'
    - '*MIPI1_D1_N*'
    - '*MIPI1_D2_P*'
    - '*MIPI1_D2_N*'
    - '*MIPI1_D3_P*'
    - '*MIPI1_D3_N*'
    tolerance_mm: 1.0
    diff_impedance_ohm: 100.0
    source: 'Raspberry Pi CM5 Datasheet Section 3.7: MIPI D-PHY 100 ohm differential pairs'
  - name: mipi_csi0_camera
    board: main
    kind: diff_pairs
    nets:
    - '*MIPI0_C_P*'
    - '*MIPI0_C_N*'
    - '*MIPI0_D0_P*'
    - '*MIPI0_D0_N*'
    - '*MIPI0_D1_P*'
    - '*MIPI0_D1_N*'
    tolerance_mm: 1.0
    diff_impedance_ohm: 100.0
    source: 'Raspberry Pi CM5 Datasheet Section 3.7: MIPI D-PHY 100 ohm differential pairs'
