    notes: Right edge 3.5mm CTIA TRRS audio jack J1 (PJ-3701-SMT C2684645 with isolated NC mechanical Tip plug-detect switch between Pin 5 /TIP_SW and Pin 6 /GND) on audio_right daughterboard with Ring 2 grounded (Kelvin-sensed via C20=2.2uF C159814 placed at [32.30, 12.50] mm with dedicated F.Cu trace directly to J1.2 and R29=1.3k C25866 into /HS_REF_MUX), Pin 5 /TIP_SW pulled up to 2.8V /+2V8_ANA via R30=22k (C25768) + C23=2.2uF (C159814, tau=48.4ms, t_qual=90.1ms) and ESD-clamped by D10 (PESD3V3U1UA,115 C403915) to drive U1 (TLV7041DBVR C702122 with R23=22k/R31=1M 72mV hysteresis, V_TH+=2.365V, V_TH-=2.293V) for active-low mechanical Tip plug detection (/HP_DET_N -> R4=1k -> /HP_DET on J2/J_AUDR pin 7 across Type-B opposite-side contact 8P 0.5mm FFC c_audio_right to dedicated main-board net /HP_DET on CM5 GPIO24 U1 pin 45 with R37=10k pull-up, completely independent of Sleeve mic impedance), while U2 (TLV7041DBVR C702122, IN+ on /V_REF_HI=2.344V, IN- driven directly by U1's debounced /HP_DET_N output) gates /MIC_SEL low whenever unplugged or during the 90.1ms insertion qualification window and releases /MIC_SEL synchronously with /HP_DET_N once a plug is seated; Sleeve (/HS_MIC_DET) is protected by unidirectional 3.3V ESD diode D3 (PESD3V3U1UA,115 C403915 matching D10, clamping negative excursions at -0.7V and positive ESD above 3.3V) and biased from 2.8V ultra-low-noise LDO U5 (LP5907MFX-2.8/NOPB C186700 with local 1uF input cap C22 C52923 within 1.5mm of U5.1/U5.2, 1uF output cap C21 C52923, R24=1.3k C25866 minimum preload bleeder providing 2.58mA total rail sink to prevent back-drive up to >6V on J1.1, and D12 PESD3V3U1UA,115 C403915 shunt clamp on /+2V8_ANA) via RC-filtered R11=470R + C11=10uF (/HS_BIAS) and R1=2.2k CTIA electret mic bias pull-up on /HS_MIC_DET (AC-coupled by C10=2.2uF into R21=220R so R_mic||R1+R21=1.32k matches R29=1.30k on Ring 2, with U4 outputs AC-coupled by C13/C14=2.2uF and R8/R9=100R onto /MIC_P and /MIC_N with symmetrical main-board DC charge bleeders R51=47k and R52=47k C25792 to /GND ahead of C33/C34=2.2uF) alongside non-loading sense filter R12=47k (C25792) + C12=4.7nF (C1538, tau=221us << 90.1ms) and rail-to-rail dual-series silicon clamp D11 (BAV99,215 C2500 to /GND and /+2V8_ANA) on /DET_IN into U3 (TLV7041DBVR C702122, IN- on /V_REF_LO=0.270V from R13=2.2k/R14=10k/R16=1.3k ladder, IN+ /U3_INP via R27=2.2k C25879 and R28=1M C26083 hysteresis to /MIC_SEL with R17=2.2k pull-up, V_TH+=0.283V [300 ohm] and V_TH-=0.121V [120 ohm]) so 3-pole TRS plugs (R_sleeve < 100 ohm, V_U3P <= 0.155V < 0.270V) deterministically hold or reset /MIC_SEL=0V (internal mic MK1) without bistable lockup while 4-pole CTIA headsets (680 ohm <= R_sleeve <= 10k or R_sleeve=inf when booted or plugged in with inline hardware mute switch open) deterministically drive /MIC_SEL=3.3V (external headset mic via TS5A23159DGSR dual SPDT differential mic mux U4 biased at 0.795V /MUX_BIAS_FILT via R18=68k/R19=27k, with R21=220R/R29=1.3k balanced network and matched ultra-low-leakage BAV99,215 C2500 clamps D8 on /HS_MIC_MUX and D9 on /HS_REF_MUX between /GND and /+3V3); mouth faces +X
