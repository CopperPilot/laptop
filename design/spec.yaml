  name: 13-inch Thin Aluminum CM5 Laptop
  summary: 13-inch thin CNC aluminum laptop powered by Raspberry Pi Compute Module 5 with scissor keyboard, multi-touch trackpad, 2S2P 7.4V 9,000mAh (66.6Wh) Li-Po battery pack (four identical LP4466104 cells contoured around and under the trackpad), dual left USB-C ports (45-65W 20V PD charging via CH224A + BQ25798RQMR 2S NVDC buck-boost charger and TPS56628DDAR 5V/6A synchronous buck converter), right 3.5mm audio jack, stereo speakers, mic, lid Hall sensor, and 1080p MIPI webcam
