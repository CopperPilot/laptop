- question: Power tree and 2S 45-65W USB-C PD charging architecture?
  choice: 'Autonomous CH224A PD 3.0 sink controller U1 on usb_left (C42459160, strapped for 20V PD request via single-resistor R11=120k 1% C25750 on CFG1 to GND with CFG2/CFG3 left open per CH224 Section 5.2.1, powered from unswitched J2_VBUS [C12=1uF + C13=100nF = 1.1uF <= 4.7uF cSnkPwr] via R3/R4 to VHV/VBUS with C5=1uF decoupling, driving back-to-back AO4407A P-MOSFET load switch Q1/Q2 C2841482 via 2N7002 Q3/Q4 + R13/R14=10k + C17=100nF + D9=BZT52C12 to isolate downstream VBUS_PD bulk capacitance C15=10uF+C16=100nF, with U4 XC6216B332MR-G and U3.10 TPD6S300RUKR VPWR powered from J2_VBUS and U5.10 powered from dedicated U6 XC6206P332MR-G C5446 on +5V_USBC) -> 10-pin 1.0mm harness J5 (SM10B-SRSS-TB(LF)(SN) C160409: 5x VBUS_PD + 5x GND = 5.0A rating, with /VBUS_PD and /+5V_USBC removed from 0.5mm FFC J_USBL) -> BQ25798RQMR I2C 5A 1S-4S buck-boost battery charger & NVDC power-path manager U_CHG (C2876593, 3.6-24V input, 26V VBUS_OVP, with VAC1 pin 9 on /VBUS_PD protected by low-clamping 22V-standoff / 27.7V-clamping surge TVS D7 TVS2200DRVR C2875234 and switched into VBUS/VAC2 pins 2/3/8 /CHG_VBUS via external back-to-back 30V N-MOSFETs Q3/Q4 [2x AO3400A C20917] driven by ACDRV1 pin 11 via R69=10R with R60=100R+C82=10nF on /CHG_AC_SRC, R_PROG=8.2k 1% C25981 setting 2S cell count [8.40V VREG, 7.0V VSYSMIN] and 750kHz switching frequency with L1=2.2uH 10A inductor FXL0630-2R2-M C167218 between SW1/SW2 and 47nF bootstrap caps on BTST1/BTST2, ILIM_HIZ divider R29=78.7k 1% C2998104 / R30=100k 1% C25741 from REGN setting V_ILIM_HIZ=2.80V [I_INDPM=2.25A -> 45W hardware input limit at 20V so 45W 20V@2.25A PD adapters are never overloaded prior to software I2C override, while CM5 software can disable EN_ILIM_HIZ_PIN over I2C to allow 3.25A / 65W on 65W contracts], ~QON pin 12 relying on internal bias pull-up and isolated from CM5 /CM5_PWR_BUT via dual-anode blocking Schottky diodes D16/D17 [2x B16WS C364278] to J_KB pin 19, R50=100R C25076 Kelvin battery voltage sense on BATP pin 18 from fused /VBAT side of 5A fuse F1, and R23=5.23k C11631 / R42=30.1k C29402 JEITA NTC divider from REGN on TS pin 16 to J_BAT pin 5 clamped by 5.5V TVS diode D19 TSD05CDYFR C20611048) -> single 8-pin JST-PH battery pack connector J_BAT (S8B-PH-SM4-TB(LF)(SN) C265121: pins 1..4 VBAT+ on /VBAT_PACK via 5A fuse F1 JFC1206-1500FS C136351 to /VBAT, pin 5 TS NTC, pins 6..8 GND) connected to the 2S2P 7.4V 9,000mAh / 66.6Wh battery_pack (4 identical LP4466104 cells with integrated 2S protection/balance board) -> dual 6A synchronous buck converters U_BUCK and U_BUCK2 (2x TPS56628DDAR C485522, 12A total 5V capacity from 2S NVDC /VSYS [6.5-8.6V], with R33/R34=100k/22.1k and R67/R68=100k/22.1k UVLO dividers setting >=6.63V battery cutoff, L2/L5=2.2uH FXL0630-2R2-M C167218, feedback dividers R27/R28=133k/24k and R64/R65=133k/24k setting V_OUT=5.00V, and 5.5V-standoff TVS diodes D3/D18/D2 TSD05CDYFR C20611048): U_BUCK supplies /+5V (5.00V, 6A) for CM5 +5V_CM5 (via back-to-back common-source blocking AO4407A P-MOSFETs Q1/Q2 gated on /DBG_GATE by U_DBG ST pin 8 with R59=10k tied to common source /DBG_Q_SRC + TPS2117DRLR U_DBG with MODE pin 5 on /DBG_PWR and PR1 pin 4 on /DBG_PR1 pulled low by 2N7002 Q_DBG C8545 gated by /+5V so internal /+5V always takes priority over TP1 /DBG_PWR) and SY6280AAC U_VBUS (with R31=3.3k C25890 setting 2.06A typ / 1.55A min limit on /+5V_USBC), U_BUCK2 supplies /+5V_PER (5.00V, 6A) for PAM8406DR Class-D amp U_AMP and TLV62569DBVR +3.3V_PER buck U_3V3, TPS61165DBVR backlight boost U_BL is powered directly from 2S /VSYS via high-side P-MOSFET switch Q_BL (AO3401A C15127) on /VSYS_BL, and HT7530S 30V-input 3.0V RTC LDO U_RTC (C347214) runs on 2S /VBAT.'
  reason: Moving from 1S to 2S2P (7.4V nominal, 6.0-8.4V) cuts battery and charger/converter currents in half for the same power (~3.0-4.8A instead of 11-13A), eliminates the dual-AO4407A battery bypass stage (Q_BAT1/Q_BAT2) and the 4 separate cell connectors/fuses/ballast resistors, allows direct 20V USB-C PD charging at 45-65W through BQ25798RQMR with a single autonomous CH224A 20V PD sink (eliminating FUSB302BMPX and the discrete 13V OVP circuit on usb_left), and replaces the 5V boost converter with a high-efficiency 6A synchronous buck converter (TPS56628DDAR) from 2S VSYS (6.0-8.6V).
- question: Mechanical enclosure continuity (bottom pan, lid magnet pocket, and hinge cable routing)?
  choice: '1) bottom_shell is a continuous CNC 6061-T6 aluminum pan (Z=-1.10..-0.02 mm) with no bottom service slot (F_FLASH removed; SW1 and TP1..TP5 moved to top side of main board) and no through-cutouts under usb_left (all usb_left components placed on top side F.Cu). 2) lid_magnet sits in a blind internal pocket inside the lid (Z=9.35..10.38 mm between display_panel/display_bezel and lid_shell continuous inner ceiling Z=10.42 mm) with F_HALL.view=any and zero hole through lid_shell outer skin. 3) c_display_dsi, c_display_bl, and c_webcam_csi (kind=coax, 1.13 mm micro-coax bundle) cross the hinge at constant X (24.0, 42.0, 136.0 mm) inside the enclosed hinge barrel and internal display_bezel channels without any axial X-jog that would loop outside the rear edge or poke through the bezel.'
